    S6:
      ambient_c: [20, 28]
      expected: [elevated_electrical_load, cooling_degradation]
      faults:
        - {type: cooling_degradation, start: "1+12:00", end: "end", ramp_days: 0.5,
           params: {effectiveness: [0.08, 0.18], pump_speed_factor: [0.5, 0.7]}}
      trigger:
        - {depart: "08:30", kind: highway, distance_km: 150, dest: far, towing: true,
           dc_charge: {power_w: 150000, target_soc: 0.9}}
        - {depart: "16:00", kind: highway, distance_km: 150, dest: home}
    S7:
      ambient_c: [20, 28]
      expected: [cooling_degradation, temperature_sensor_fault]
