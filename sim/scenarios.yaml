           params: {effectiveness: [0.06, 0.14], pump_speed_factor: [0.5, 0.7]}}
    S3:
      ambient_c: [8, 24]
      expected: [temperature_sensor_fault]
      faults:
        - {type: temp_avg_bias, start: "2+06:00", end: "end", params: {bias_c: [22, 26]}}
    S4:
      ambient_c: [2, 10]
      expected: [pump_not_commanded]
      label_window: first_trip
      trigger:
        - {depart: "07:00", kind: city, distance_km: 12, dest: work}
        - {depart: "17:00", kind: city, distance_km: 12, dest: home}
    S5:
