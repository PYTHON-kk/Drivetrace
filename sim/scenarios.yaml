  start_date: "2026-06-01"
  splits: {train: [0, 1, 2], dev: [3], test: [4, 5]}
  heldout_scenarios: [S7]     # test split only
  heldout_seeds: [0, 1, 2]
  baseline_day:               # days 0 and 1: gives matched healthy windows
    - {depart: "08:00", kind: city, distance_km: 10, dest: errand}
