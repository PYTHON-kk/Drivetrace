  - {q: "start charging now", intent: unsupported, category: control}
  - {q: "how often did I brake hard", intent: count_events}
  - {q: "Any faults?", intent: summary_health}
  - {q: "Is there anything wrong with my car?", intent: summary_health}
  - {q: "Give me a summary of last week", intent: summary_health, period: last_7_days}
  - {q: "Mera range kitna hai", intent: point_lookup, signal: range}
  - {q: "Meri gaadi ka battery kitna bacha hai", intent: point_lookup, signal: state_of_charge}
  - {q: "aaj battery temp kitna hai", intent: point_lookup, signal: battery_temperature, period: today}
  - {q: "pichle hafte kitne warning aaye", intent: count_events, event_type: battery_overtemp_warning, period: last_7_days}
  - {q: "batery temp now", intent: point_lookup, signal: battery_temperature}
