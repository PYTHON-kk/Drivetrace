# Regression probe set (40 reviewer questions and edge cases).
# NOTE: This suite tracks coverage of reviewer probes and edge cases.
# It is an in-sample regression benchmark (rules tuned alongside these cases), NOT an independent external evaluation.

items:
  - {q: "What's my state of charge?", intent: point_lookup, signal: state_of_charge, aggregate: latest}
  - {q: "Whats my range", intent: point_lookup, signal: range, aggregate: latest}
  - {q: "How's my battery?", intent: summary_health}
  - {q: "What is the average speed today?", intent: point_lookup, signal: speed, period: today, aggregate: mean}
  - {q: "Max battery temperature during charging yesterday", intent: point_lookup, signal: battery_temperature, period: yesterday, event_type: charging, aggregate: max}
  - {q: "How long did my last charge take?", intent: point_lookup, event_type: charging, aggregate: duration}
  - {q: "Why did the battery warning come on last Tuesday?", intent: unsupported, category: time_clarify}
  - {q: "How many charging sessions on Monday?", intent: unsupported, category: time_clarify}
  - {q: "Warnings from 2 days ago", intent: unsupported, category: time_clarify}
  - {q: "Tell me how my efficiency changed since January", intent: unsupported, category: time_clarify}
  - {q: "last 3 weeks battery warnings", intent: unsupported, category: time_clarify}
  - {q: "Does the logged speed match the GPS speed?", intent: point_lookup, signal: speed}
  - {q: "Is my tyre pressure okay?", intent: unsupported, category: tyre_not_recorded}
  - {q: "Can you please brake now", intent: unsupported, category: control}
